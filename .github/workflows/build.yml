name: Build APK & EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: QRMaker-windows
          path: dist/*.exe

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Generate app icon
        run: npx @capacitor/assets generate --android --assetPath assets
        continue-on-error: true
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk QRMaker.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QRMaker-android
          path: QRMaker.apk

  release:
    name: Publish Release
    needs: [ windows, android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: QR메이커 v1.0.${{ github.run_number }}
          body: |
            - **QRMaker.apk** : 안드로이드 폰/태블릿에 설치
            - **QRMaker_portable_*.exe** : 윈도우에서 설치 없이 바로 실행
            - **QRMaker_Setup_*.exe** : 윈도우에 설치
          files: |
            out/QRMaker-android/*.apk
            out/QRMaker-windows/*.exe
